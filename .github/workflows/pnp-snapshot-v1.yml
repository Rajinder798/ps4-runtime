name: PnP one-shot snapshot v1 host regressions
on: [push, pull_request]
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: cmake -S tests/pnp_snapshot_v1 -B build-snapshot -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-snapshot --config Release
      - run: ctest --test-dir build-snapshot -C Release --output-on-failure
