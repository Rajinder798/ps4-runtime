name: Diagnostic stage ledger v1 host regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      LEDGER_V1_EVIDENCE: ${{ github.workspace }}/build-ledger-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: cmake -S tests/diagnostic_stage_ledger_v1 -B build-ledger -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-ledger --config Release
      # All frozen suites retain their own independent workflows at this head.
      - run: ctest --test-dir build-ledger -C Release -R "^stage-ledger-v1$" --output-on-failure
      - name: Preserve host evidence and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: stage-ledger-v1-${{ matrix.os }}
          path: |
            build-ledger-evidence
            build-ledger/Testing/Temporary
