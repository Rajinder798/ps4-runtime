name: HID list assessment v1 offline regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HID_V1_EVIDENCE: ${{ github.workspace }}/build-hid-evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: cmake -S tests/hid_list_assessment_v1 -B build-assessment -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-assessment --config Release
      # Frozen suites have their own Windows/Linux workflows at this same head.
      # Keep this workflow's result specific to the new offline surfaces.
      - run: ctest --test-dir build-assessment -C Release -R "^hid-" --output-on-failure
      - name: Preserve synthetic evidence and test failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hid-list-v1-host-${{ matrix.os }}
          path: |
            build-hid-evidence
            build-assessment/Testing/Temporary
