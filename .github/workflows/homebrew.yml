name: Pinned OpenOrbis homebrew build
on:
  push:
    paths:
      - '.github/workflows/homebrew.yml'
      - 'config/upstream-lock.json'
      - 'tools/build_homebrew.py'
      - 'tools/make_sce_imports.py'
      - 'tools/elf_relocations.py'
      - 'tools/engine_coverage.py'
      - 'tools/research_contract.py'
      - 'config/startup-research.json'
      - 'research/shadps4/**'
      - 'research/results/2026-10-18-openorbis-startup.json'
      - 'src/elf_inspector.cpp'
      - 'include/ps4/elf_inspector.h'
      - 'src/main.cpp'
      - 'research/homebrew/**'
      - 'config/service-roundtrip.json'
      - 'config/videoout-pattern.json'
      - 'config/pad-videoout.json'
      - 'config/audio-pattern.json'
      - 'config/interactive-av.json'
      - 'config/live-av.json'
      - 'config/pad-axes.json'
      - 'config/pad-hotplug-av.json'
      - 'config/live-av-v2.json'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-world:
    strategy:
      fail-fast: false
      matrix:
        sample: [hello-world, service-roundtrip, videoout-pattern, pad-videoout, audio-pattern, interactive-av, live-av, pad-axes, pad-hotplug-av, live-av-v2]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build runtime inspector
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/native --config Release
      - name: Fetch verified portable LLVM cross-compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/tools | Out-Null
          $archive = 'build/tools/llvm-mingw-20261006-ucrt-x86_64.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a') { throw 'LLVM archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath build/tools
      - name: Fetch pinned engine source for static import coverage (read-only, not built)
        run: |
          python tools/engine_coverage.py prepare --destination build/engine-coverage/patched
          python tools/engine_coverage.py prepare --destination build/engine-coverage/unpatched --unpatched
      - name: Build and inspect selected homebrew
        run: python tools/build_homebrew.py --sample ${{ matrix.sample }} --llvm-bin build/tools/llvm-mingw-20261006-ucrt-x86_64/bin --inspector build/native/Release/ps4-runtime.exe --engine-sources build/engine-coverage
      - name: Upload research evidence (no SDK or homebrew binaries)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openorbis-${{ matrix.sample }}-evidence
          path: |
            build/homebrew/${{ matrix.sample }}/build-evidence.json
            build/homebrew/${{ matrix.sample }}/dynamic-symbols.txt
            build/homebrew/${{ matrix.sample }}/sce-imports.json
            build/homebrew/${{ matrix.sample }}/sce-relocations.json
            build/homebrew/${{ matrix.sample }}/sce-startup.json
            build/homebrew/${{ matrix.sample }}/engine-coverage.json
          if-no-files-found: warn
