name: PnP boundary cleanup v2 host regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: cmake -S tests/pnp_readiness_v2 -B build-pnp-cleanup -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-pnp-cleanup --config Release
      - run: ctest --test-dir build-pnp-cleanup -C Release -R "^boundary-cleanup-v2$" --output-on-failure
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: boundary-cleanup-v2-${{ matrix.os }}
          path: build-pnp-cleanup/Testing/Temporary
          if-no-files-found: ignore
